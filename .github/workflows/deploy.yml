name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          DEPLOY_TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          # 创建临时目录
          mkdir -p /tmp/deploy
          
          # 创建临时打包文件
          tar -czf /tmp/deploy/deploy.tar.gz \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='.env' \
              --exclude='site/accounts/.logins' \
              .
          
          # 创建新的发布目录
          ssh $SERVER_USER@$SERVER_HOST "mkdir -p $DEPLOY_PATH/releases/$DEPLOY_TIMESTAMP"
          
          # 复制文件到服务器
          scp /tmp/deploy/deploy.tar.gz $SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/releases/$DEPLOY_TIMESTAMP/
          
          # 解压文件并清理
          ssh $SERVER_USER@$SERVER_HOST "cd $DEPLOY_PATH/releases/$DEPLOY_TIMESTAMP && \
            tar -xzf deploy.tar.gz && \
            rm deploy.tar.gz && \
            cd $DEPLOY_PATH && \
            ln -sfn releases/$DEPLOY_TIMESTAMP current && \
            cd current && \
            docker compose build && \
            docker compose up -d"